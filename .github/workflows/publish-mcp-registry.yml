# Publishes the io.github.posteverywhere/mcp entry to the official MCP
# Registry via GitHub OIDC. This namespace is what GitHub's MCP Registry
# (github.com/mcp), VS Code, and Copilot surface — the ai.posteverywhere
# entry (published via domain auth) is not ingested there.
name: Publish to MCP Registry (io.github namespace)
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Publish
        run: |
          cp server.github.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
